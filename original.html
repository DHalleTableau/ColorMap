<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RGB Original View</title>
<script src="tableau.extensions.1.latest.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #msg { position: absolute; left: 8px; right: 8px; top: 8px; color: #8a8a8a;
         font: 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="msg"></div>
<script>
// Shows the applied image in true color. Reads the workbook's "Image Hex" parameter (hex RRGGBB per
// pixel, row-major, resolutions 16/32/64/128 back to back) and draws the 128 x 128 block. Redraws
// whenever the parameter changes, e.g. after Apply in the image selector.
const PARAM_NAME = "Image Hex";
const N = 128;
const START = 6 * (16 * 16 + 32 * 32 + 64 * 64);  // character offset of the 128 block
const view = document.getElementById("view"), ctx = view.getContext("2d");
const msg = document.getElementById("msg");
let pixels = null;  // ImageData for the 128 block

function decode(hex) {
  const need = START + N * N * 6;
  if (!hex || hex.length < need) return null;
  const img = new ImageData(N, N), d = img.data;
  for (let i = 0, o = START; i < N * N; i++, o += 6) {
    d[i * 4] = parseInt(hex.substr(o, 2), 16);
    d[i * 4 + 1] = parseInt(hex.substr(o + 2, 2), 16);
    d[i * 4 + 2] = parseInt(hex.substr(o + 4, 2), 16);
    d[i * 4 + 3] = 255;
  }
  return img;
}

function draw() {
  const dpr = window.devicePixelRatio || 1, cw = view.clientWidth, ch = view.clientHeight;
  view.width = cw * dpr; view.height = ch * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cw, ch);
  if (!pixels) return;
  const src = document.createElement("canvas"); src.width = src.height = N;
  src.getContext("2d").putImageData(pixels, 0, 0);
  const s = Math.min(cw, ch), x = (cw - s) / 2, y = (ch - s) / 2;  // square, centred
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(src, x, y, s, s);
}

async function show(param) {
  pixels = decode(param.currentValue.value);
  msg.textContent = pixels ? "" : "Image Hex is empty or too short.";
  draw();
}

(async () => {
  try {
    await tableau.extensions.initializeAsync();
    const params = await tableau.extensions.dashboardContent.dashboard.getParametersAsync();
    const p = params.find(q => q.name === PARAM_NAME);
    if (!p) { msg.textContent = 'No parameter named "' + PARAM_NAME + '" in this workbook.'; return; }
    await show(p);
    p.addEventListener(tableau.TableauEventType.ParameterChanged, async e => show(await e.getParameterAsync()));
  } catch (e) {
    msg.textContent = "Not running inside Tableau.";
  }
})();
window.addEventListener("resize", draw);
</script>
</body>
</html>
