<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RGB Pixel Editor</title>
<script type="module" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
<style>
  html, body { margin: 0; background: #000; color: #e6e6e6;
               font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #page { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  #side { width: 300px; flex: 0 0 300px; display: flex; flex-direction: column; gap: 12px; }
  #side h2 { font-size: 14px; margin: 0; color: #fff; }
  #orig { width: 300px; height: 300px; background: #111; display: block; }
  tableau-viz { flex: 0 0 auto; }
  #wrap { display: flex; flex-direction: column; height: 420px; box-sizing: border-box; gap: 6px; }
  canvas { display: block; width: 100%; flex: 1 1 auto; min-height: 0; background: #111; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  .row { display: flex; gap: 4px; }
  button { flex: 1; background: #1e1e1e; color: #fff; border: 1px solid #3a3a3a; border-radius: 3px;
           padding: 4px 0; font: inherit; cursor: pointer; }
  button:hover { background: #2a2a2a; }
  button.primary { background: #2f6db0; border-color: #2f6db0; font-weight: 600; }
  button.primary:hover { background: #3a7fcc; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: #8a8a8a; height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="page">
<div id="side">
<h2>Image Input</h2>
<div id="wrap">
  <canvas id="view"></canvas>
  <div class="row">
    <button id="left" title="Nudge left">&larr;</button>
    <button id="up" title="Nudge up">&uarr;</button>
    <button id="down" title="Nudge down">&darr;</button>
    <button id="right" title="Nudge right">&rarr;</button>
    <button id="zin" title="Zoom in (smaller square)">+</button>
    <button id="zout" title="Zoom out (bigger square)">&minus;</button>
  </div>
  <div class="row">
    <button id="choose">Choose image&hellip;</button>
    <button id="apply" class="primary" disabled>Apply</button>
  </div>
  <div id="status">Choose an image to start.</div>
  <input id="file" type="file" accept="image/*">
</div>
<h2>Original Image</h2>
<canvas id="orig"></canvas>
</div>
<tableau-viz id="viz" toolbar="bottom" hide-tabs></tableau-viz>
</div>
<script>
// Tableau Public page: embeds the published dashboard and plays the role of both extensions
// (Public doesn't run them). Apply crops/resizes in the browser and sets the viz's "Image Hex"
// parameter (hex RRGGBB per pixel, row-major, 16/32/64/128 back to back) via the Embedding API.
const RESOLUTIONS = [16, 32, 64, 128];
const PARAM_NAME = "Image Hex";
const NUDGE = 0.1, ZOOM = 0.8;
const view = document.getElementById("view"), ctx = view.getContext("2d");
const statusEl = document.getElementById("status");
// Viz URL: ?viz=<public view URL> overrides the default.
const DEFAULT_VIZ = "https://public.tableau.com/views/RGB-Pixel-Editor/Editor";
const VIZ_URL = new URLSearchParams(location.search).get("viz") || DEFAULT_VIZ;
const vizEl = document.getElementById("viz");
let img = null, crop = null, vizReady = false;

function status(msg) { statusEl.textContent = msg; }

function clamp(c) {
  const size = Math.max(16, Math.min(Math.round(c.size), img.width, img.height));
  return { size,
           x0: Math.max(0, Math.min(Math.round(c.x0), img.width - size)),
           y0: Math.max(0, Math.min(Math.round(c.y0), img.height - size)) };
}

function layout() {
  const dpr = window.devicePixelRatio || 1, cw = view.clientWidth, ch = view.clientHeight;
  if (view.width !== cw * dpr || view.height !== ch * dpr) { view.width = cw * dpr; view.height = ch * dpr; }
  const s = Math.min(cw / img.width, ch / img.height);
  return { dpr, s, ox: (cw - img.width * s) / 2, oy: (ch - img.height * s) / 2, cw, ch };
}

function draw() {
  if (!img) return;
  const L = layout();
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  ctx.clearRect(0, 0, L.cw, L.ch);
  ctx.drawImage(img, L.ox, L.oy, img.width * L.s, img.height * L.s);
  const x = L.ox + crop.x0 * L.s, y = L.oy + crop.y0 * L.s, s = crop.size * L.s;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.beginPath();
  ctx.rect(L.ox, L.oy, img.width * L.s, img.height * L.s);
  ctx.rect(x, y, s, s);
  ctx.fill("evenodd");
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5;
  ctx.strokeRect(x + 0.75, y + 0.75, s - 1.5, s - 1.5);
}

function setCrop(c) {
  crop = clamp(c);
  draw();
  status("Square " + crop.size + " px at (" + crop.x0 + ", " + crop.y0 + "). Press Apply.");
}
function nudge(dx, dy) { if (!img) return; const d = Math.max(1, crop.size * NUDGE); setCrop({ x0: crop.x0 + dx * d, y0: crop.y0 + dy * d, size: crop.size }); }
function zoom(f) {
  if (!img) return;
  const size = Math.max(16, Math.min(crop.size * f, img.width, img.height));
  const cx = crop.x0 + crop.size / 2, cy = crop.y0 + crop.size / 2;
  setCrop({ x0: cx - size / 2, y0: cy - size / 2, size });
}

// Downscale in halving steps so small grids average the photo instead of sampling single pixels.
function resizeSquare(n) {
  let src = document.createElement("canvas"), w = crop.size;
  src.width = src.height = w;
  src.getContext("2d").drawImage(img, crop.x0, crop.y0, w, w, 0, 0, w, w);
  while (w / 2 >= n) {
    const half = document.createElement("canvas"); const hw = Math.floor(w / 2);
    half.width = half.height = hw;
    const hc = half.getContext("2d"); hc.imageSmoothingQuality = "high";
    hc.drawImage(src, 0, 0, w, w, 0, 0, hw, hw);
    src = half; w = hw;
  }
  const out = document.createElement("canvas"); out.width = out.height = n;
  const oc = out.getContext("2d"); oc.imageSmoothingQuality = "high";
  oc.drawImage(src, 0, 0, w, w, 0, 0, n, n);
  return oc.getImageData(0, 0, n, n).data;
}

function encode() {
  const hex = [];
  for (const n of RESOLUTIONS) {
    const d = resizeSquare(n);
    for (let i = 0; i < d.length; i += 4)
      hex.push(((1 << 24) | (d[i] << 16) | (d[i + 1] << 8) | d[i + 2]).toString(16).slice(1));
  }
  return hex.join("").toUpperCase();
}


async function apply() {
  const btn = document.getElementById("apply");
  btn.disabled = true;
  try {
    status("Encoding…");
    const t = performance.now();
    const hex = encode();
    drawOriginal(hex);
    if (!vizReady) { status("Viz not loaded yet; try again in a moment."); return; }
    status("Sending to Tableau…");
    await vizEl.workbook.changeParameterValueAsync(PARAM_NAME, hex);
    status("Applied: " + crop.size + " px square (" + Math.round(performance.now() - t) + " ms).");
  } catch (e) {
    status("Apply failed: " + e.message);
  } finally {
    btn.disabled = !img;
  }
}

const N = 128, START = 6 * (16 * 16 + 32 * 32 + 64 * 64);
function drawOriginal(hex) {
  const c = document.getElementById("orig"), dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
  if (!hex || hex.length < START + N * N * 6) return;
  const id = new ImageData(N, N);
  for (let i = 0, o = START; i < N * N; i++, o += 6) {
    id.data[i * 4] = parseInt(hex.substr(o, 2), 16);
    id.data[i * 4 + 1] = parseInt(hex.substr(o + 2, 2), 16);
    id.data[i * 4 + 2] = parseInt(hex.substr(o + 4, 2), 16);
    id.data[i * 4 + 3] = 255;
  }
  const src = document.createElement("canvas"); src.width = src.height = N;
  src.getContext("2d").putImageData(id, 0, 0);
  g.imageSmoothingQuality = "high";
  g.drawImage(src, 0, 0, c.width, c.height);
}

function load(file) {
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    img = im;
    const m = Math.min(img.width, img.height);
    crop = { x0: (img.width - m) >> 1, y0: (img.height - m) >> 1, size: m };
    document.getElementById("apply").disabled = false;
    draw();
    status(file.name + " (" + img.width + " x " + img.height + "). Position the square, then Apply.");
  };
  im.onerror = () => status("Can't read that file as an image.");
  im.src = url;
}

let drag = null;
view.addEventListener("pointerdown", e => {
  if (!img) return;
  const L = layout(), r = view.getBoundingClientRect();
  drag = { px: e.clientX - r.left, py: e.clientY - r.top, x0: crop.x0, y0: crop.y0, s: L.s };
  view.setPointerCapture(e.pointerId); view.classList.add("dragging");
});
view.addEventListener("pointermove", e => {
  if (!drag) return;
  const r = view.getBoundingClientRect();
  setCrop({ x0: drag.x0 + (e.clientX - r.left - drag.px) / drag.s,
            y0: drag.y0 + (e.clientY - r.top - drag.py) / drag.s, size: crop.size });
});
view.addEventListener("pointerup", () => { drag = null; view.classList.remove("dragging"); });
view.addEventListener("wheel", e => { if (!img) return; e.preventDefault(); zoom(e.deltaY > 0 ? 1 / ZOOM : ZOOM); }, { passive: false });

document.getElementById("left").onclick = () => nudge(-1, 0);
document.getElementById("right").onclick = () => nudge(1, 0);
document.getElementById("up").onclick = () => nudge(0, -1);
document.getElementById("down").onclick = () => nudge(0, 1);
document.getElementById("zin").onclick = () => zoom(ZOOM);
document.getElementById("zout").onclick = () => zoom(1 / ZOOM);
document.getElementById("apply").onclick = apply;
document.getElementById("choose").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = e => { if (e.target.files[0]) load(e.target.files[0]); e.target.value = ""; };
window.addEventListener("resize", draw);

// load the viz and show its current image
vizEl.addEventListener("firstinteractive", async () => {
  vizReady = true;
  try {
    const params = await vizEl.workbook.getParametersAsync();
    const p = params.find(q => q.name === PARAM_NAME);
    if (p) drawOriginal(p.currentValue.value);
    else status('Viz has no parameter named "' + PARAM_NAME + '".');
  } catch (e) { status("Couldn't read the viz parameters: " + e.message); }
});
if (VIZ_URL.startsWith("http")) vizEl.src = VIZ_URL;
else status("Set the Tableau Public view URL (?viz=...) to load the dashboard.");
</script>
</body>
</html>
